<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Andrew &amp; Catherine | Share Your Memories</title>
  <style>
    :root { --cream:#f5ebdf; --paper:#fff8ed; --terra:#a05234; --sage:#68775a; --ink:#4c503d; --muted:#766c5d; --line:#cfa783; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(145deg,#efe5d8,#faf5ec); color:var(--ink); font-family:Georgia,'Times New Roman',serif; padding:12px 10px max(22px,env(safe-area-inset-bottom)); overflow-x:hidden; }
    .sheet { position:relative; overflow:hidden; max-width:520px; margin:0 auto; border-radius:28px; border:1px solid #eadbca; padding:36px 20px 26px; width:100%; background:radial-gradient(circle at 50% 34%,#fffdf7,var(--paper) 76%),repeating-linear-gradient(105deg,#b58f6b08 0px,#b58f6b08 1px,transparent 1px,transparent 5px); box-shadow:0 14px 42px #76584224; text-align:center; }
    .foliage { position:absolute; width:145px; height:235px; pointer-events:none; opacity:.63; z-index:0; }
    .foliage-left { left:-27px; top:-8px; transform:rotate(-17deg); }
    .foliage-right { right:-30px; top:-13px; transform:scaleX(-1) rotate(-17deg); }
    .sheet > :not(.foliage) { position:relative; z-index:1; }
    .names { padding-top:12px; text-shadow:0 1px 0 #fffaf3; }
    .eyebrow {font: 11px/1.4 Georgia,serif;letter-spacing:5px;color:#6f7758;margin:5px 0 13px;text-transform:uppercase;}
    .script-accent {font-family:Georgia,serif;font-style:italic;font-size:clamp(31px,9vw,47px);color:var(--terra);margin:-10px 0 4px;line-height:1.05;}
    .soft-rule{height:1px;width:48%;max-width:180px;margin:13px auto;background:#cead8c;}
    .bottom-rule{margin-top:23px;opacity:.65;}
    .select { transition:background .18s,transform .18s; }
    .select:active { transform:scale(.992); background:#f7ede1; }
    .upload:active:not(:disabled) { transform:scale(.993); }
    @media(max-width:600px) { .foliage {width:111px;height:183px;opacity:.52;} .foliage-left{left:-25px;top:-6px;} .foliage-right{right:-24px;top:-6px;} .names{padding-top:8px;} }
    .names { position:relative; margin:0; color:var(--terra); font-size:clamp(27px,7.2vw,38px); font-weight:normal; line-height:1.15; }
    .heart { color:#c68a72; font-size:18px; margin:12px 0 9px; }
    .date { margin:0; text-transform:uppercase; letter-spacing:3px; font-size:13px; }
    h2 { font-weight:normal; color:#59624d; font-size:clamp(26px,7vw,39px); margin:29px 0 8px; line-height:1.13; }
    .intro { margin:0 auto 22px; max-width:335px; font-size:17px; line-height:1.6; }
    .branch { color:#879477; margin-bottom:18px; font-size:21px; }
    input[type=file] { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
    .select { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; width:100%; min-height:166px; border:2px dashed #c8ad95; border-radius:24px; padding:23px 15px; background:#fff9f1; cursor:pointer; box-shadow:0 6px 16px #8f705b0c; }
    .select:focus-within, .select:focus-visible { outline:3px solid #8a9a78; outline-offset:3px; }
    .photo-icon { font-size:48px; line-height:1.1; }
    .select strong { color:var(--terra); font-size:clamp(25px,7vw,30px); font-weight:normal; }
    .select span:last-child { font-family:system-ui,-apple-system,sans-serif; font-size:13px; color:var(--muted); line-height:1.4; }
    .file-info { margin:15px auto; font-family:system-ui,-apple-system,sans-serif; color:var(--muted); font-size:13px; }
    .preview { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:12px 0; }
    .preview img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:11px; background:#ebdfd0; }
    .preview[hidden] { display:none; }
    .upload { border:0; border-radius:18px; padding:17px 22px; width:100%; background:var(--sage); color:white; font:600 17px system-ui,-apple-system,sans-serif; cursor:pointer; box-shadow:0 6px 16px #72805a38; }
    .upload:focus-visible { outline:3px solid #536946; outline-offset:4px; }
    .upload:disabled { opacity:.55; cursor:not-allowed; box-shadow:none; }
    .status { margin-top:17px; padding:13px; background:#f5ede3; border-radius:13px; font:14px/1.55 system-ui,-apple-system,sans-serif; overflow-wrap:anywhere; }
    .status[hidden] { display:none; }
    progress { width:100%; height:10px; accent-color:var(--sage); margin-top:12px; }
    progress[hidden] { display:none; }
    .lower-sprig {position:absolute !important; z-index:0 !important; width:94px;height:145px;bottom:-34px;left:-34px;transform:rotate(183deg);opacity:.28;pointer-events:none;}
    .foot { display:flex; justify-content:center; gap:8px; align-items:center; margin-top:27px; color:var(--muted); font:12px/1.5 system-ui,-apple-system,sans-serif; }
    .thanks { margin-top:21px; font-style:italic; font-size:24px; color:var(--terra); }
    @media (max-width:600px) {
      body { padding:0; background:var(--paper); }
      .sheet { max-width:none; min-height:100dvh; border:0; border-radius:0; box-shadow:none; padding:clamp(24px,6vh,44px) 19px max(24px,env(safe-area-inset-bottom)); }
      .names { font-size:clamp(26px,7.3vw,36px); }
      .date { letter-spacing:2px; font-size:12px; }
      h2 { margin-top:clamp(21px,5vh,36px); }
      .intro { font-size:16px; line-height:1.45; margin-bottom:12px; }
      .branch { margin-bottom:12px; }
      .select { min-height:145px; padding:19px 12px; border-radius:19px; }
      .photo-icon { font-size:39px; }
      .file-info { margin:11px auto; }
      .upload { min-height:55px; }
      .foot { margin-top:21px; }
      .thanks { margin-top:12px; }
    }
    @media (max-width:365px) { .sheet{padding-left:16px;padding-right:16px;} .names{font-size:26px;} .select strong{font-size:26px;} }
  </style>
</head>
<body>
  <main class="sheet">
    <svg class="foliage foliage-left" viewBox="0 0 220 360" aria-hidden="true" focusable="false"><defs><linearGradient id="sageLeaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#819077"/><stop offset="1" stop-color="#bac2a3"/></linearGradient><linearGradient id="dryLeaf" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#b58267"/><stop offset="1" stop-color="#ead0b4"/></linearGradient></defs><g opacity=".78"><path d="M-20 291 C58 257 48 135 180 8" fill="none" stroke="#949e82" stroke-width="2.1"/><path d="M21 243 C-6 218 4 178 35 184 C53 212 46 229 21 243Z" fill="url(#sageLeaf)"/><path d="M43 207 C75 201 85 175 77 151 C45 155 35 178 43 207Z" fill="url(#sageLeaf)"/><path d="M55 172 C18 152 22 122 47 115 C69 134 73 150 55 172Z" fill="url(#sageLeaf)"/><path d="M87 126 C111 124 128 103 122 76 C100 79 88 99 87 126Z" fill="url(#sageLeaf)"/><path d="M116 93 C86 77 93 51 111 41 C128 56 137 77 116 93Z" fill="url(#sageLeaf)"/><path d="M151 45 C174 44 189 25 187 1 C169 5 153 24 151 45Z" fill="url(#sageLeaf)"/><path d="M-9 285 C65 222 48 119 95 47" fill="none" stroke="#c29c7a" stroke-width="1.5"/><g fill="url(#dryLeaf)"><ellipse cx="36" cy="207" rx="7" ry="34" transform="rotate(33 36 207)"/><ellipse cx="61" cy="160" rx="6" ry="30" transform="rotate(-24 61 160)"/><ellipse cx="78" cy="116" rx="6" ry="27" transform="rotate(23 78 116)"/><ellipse cx="90" cy="71" rx="5" ry="24" transform="rotate(-23 90 71)"/></g><g stroke="#d1b59b" stroke-width="1.2" opacity=".85"><path d="M0 323 Q55 245 24 124" fill="none"/><path d="M7 299 l-15 -33 M13 277 l17 -32 M20 248 l-15 -38 M24 223 l18 -28 M27 194 l-19 -32 M29 165 l14 -23"/></g><g fill="#eee4d3"><circle cx="66" cy="103" r="3.3"/><circle cx="72" cy="95" r="3"/><circle cx="63" cy="92" r="2.7"/><circle cx="150" cy="54" r="2.8"/><circle cx="159" cy="48" r="2.8"/></g></g></svg>
    <svg class="foliage foliage-right" viewBox="0 0 220 360" aria-hidden="true" focusable="false"><defs><linearGradient id="sageLeaf2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#819077"/><stop offset="1" stop-color="#bac2a3"/></linearGradient><linearGradient id="dryLeaf2" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#b58267"/><stop offset="1" stop-color="#ead0b4"/></linearGradient></defs><g opacity=".78"><path d="M-20 291 C58 257 48 135 180 8" fill="none" stroke="#949e82" stroke-width="2.1"/><path d="M21 243 C-6 218 4 178 35 184 C53 212 46 229 21 243Z" fill="url(#sageLeaf2)"/><path d="M43 207 C75 201 85 175 77 151 C45 155 35 178 43 207Z" fill="url(#sageLeaf2)"/><path d="M55 172 C18 152 22 122 47 115 C69 134 73 150 55 172Z" fill="url(#sageLeaf2)"/><path d="M87 126 C111 124 128 103 122 76 C100 79 88 99 87 126Z" fill="url(#sageLeaf2)"/><path d="M116 93 C86 77 93 51 111 41 C128 56 137 77 116 93Z" fill="url(#sageLeaf2)"/><path d="M151 45 C174 44 189 25 187 1 C169 5 153 24 151 45Z" fill="url(#sageLeaf2)"/><path d="M-9 285 C65 222 48 119 95 47" fill="none" stroke="#c29c7a" stroke-width="1.5"/><g fill="url(#dryLeaf2)"><ellipse cx="36" cy="207" rx="7" ry="34" transform="rotate(33 36 207)"/><ellipse cx="61" cy="160" rx="6" ry="30" transform="rotate(-24 61 160)"/><ellipse cx="78" cy="116" rx="6" ry="27" transform="rotate(23 78 116)"/><ellipse cx="90" cy="71" rx="5" ry="24" transform="rotate(-23 90 71)"/></g><g stroke="#d1b59b" stroke-width="1.2" opacity=".85"><path d="M0 323 Q55 245 24 124" fill="none"/><path d="M7 299 l-15 -33 M13 277 l17 -32 M20 248 l-15 -38 M24 223 l18 -28 M27 194 l-19 -32 M29 165 l14 -23"/></g><g fill="#eee4d3"><circle cx="66" cy="103" r="3.3"/><circle cx="72" cy="95" r="3"/><circle cx="63" cy="92" r="2.7"/><circle cx="150" cy="54" r="2.8"/><circle cx="159" cy="48" r="2.8"/></g></g></svg>
    <div class="eyebrow">Andrew</div>
    <div class="script-accent">&amp;</div>
    <h1 class="names">Catherine</h1>
    <div class="heart" aria-hidden="true">♡</div>
    <p class="date">December 23, 2026</p>
    <h2>Share Your Memories</h2>
    <p class="intro">Upload your favorite moments from our wedding.</p>
    <div class="branch" aria-hidden="true">── ❧ ──</div>
    <input type="file" id="photos" accept="image/jpeg,image/png,image/webp" multiple>
    <label class="select" for="photos" tabindex="0" role="button" id="chooseBtn">
      <span class="photo-icon" aria-hidden="true">▧</span>
      <strong>Choose Photos</strong>
      <span>Tap here to select photos from your phone</span>
    </label>
    <div class="file-info" id="fileInfo">No photos selected yet</div>
    <div class="preview" id="preview" hidden></div>
    <button class="upload" id="uploadBtn" type="button" disabled>☁ &nbsp; Upload Photos</button>
    <progress id="progress" max="100" value="0" hidden></progress>
    <div class="status" id="status" role="status" aria-live="polite" hidden></div>
    <div class="foot">♡ &nbsp; No Google login required for guests • Photos only</div>
    <div class="soft-rule bottom-rule"></div><div class="thanks">Thank you ♡</div>
    <svg class="lower-sprig" viewBox="0 0 220 360" aria-hidden="true" focusable="false"><defs><linearGradient id="sageLeaf3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#819077"/><stop offset="1" stop-color="#bac2a3"/></linearGradient><linearGradient id="dryLeaf3" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#b58267"/><stop offset="1" stop-color="#ead0b4"/></linearGradient></defs><g opacity=".78"><path d="M-20 291 C58 257 48 135 180 8" fill="none" stroke="#949e82" stroke-width="2.1"/><path d="M21 243 C-6 218 4 178 35 184 C53 212 46 229 21 243Z" fill="url(#sageLeaf3)"/><path d="M43 207 C75 201 85 175 77 151 C45 155 35 178 43 207Z" fill="url(#sageLeaf3)"/><path d="M55 172 C18 152 22 122 47 115 C69 134 73 150 55 172Z" fill="url(#sageLeaf3)"/><path d="M87 126 C111 124 128 103 122 76 C100 79 88 99 87 126Z" fill="url(#sageLeaf3)"/><path d="M116 93 C86 77 93 51 111 41 C128 56 137 77 116 93Z" fill="url(#sageLeaf3)"/><path d="M151 45 C174 44 189 25 187 1 C169 5 153 24 151 45Z" fill="url(#sageLeaf3)"/><path d="M-9 285 C65 222 48 119 95 47" fill="none" stroke="#c29c7a" stroke-width="1.5"/><g fill="url(#dryLeaf3)"><ellipse cx="36" cy="207" rx="7" ry="34" transform="rotate(33 36 207)"/><ellipse cx="61" cy="160" rx="6" ry="30" transform="rotate(-24 61 160)"/><ellipse cx="78" cy="116" rx="6" ry="27" transform="rotate(23 78 116)"/><ellipse cx="90" cy="71" rx="5" ry="24" transform="rotate(-23 90 71)"/></g><g stroke="#d1b59b" stroke-width="1.2" opacity=".85"><path d="M0 323 Q55 245 24 124" fill="none"/><path d="M7 299 l-15 -33 M13 277 l17 -32 M20 248 l-15 -38 M24 223 l18 -28 M27 194 l-19 -32 M29 165 l14 -23"/></g><g fill="#eee4d3"><circle cx="66" cy="103" r="3.3"/><circle cx="72" cy="95" r="3"/><circle cx="63" cy="92" r="2.7"/><circle cx="150" cy="54" r="2.8"/><circle cx="159" cy="48" r="2.8"/></g></g></svg>
  </main>
  <script>
    const MAX_SIZE = 15 * 1024 * 1024;
    const allowed = new Set(['image/jpeg','image/png','image/webp']);
    const input = document.getElementById('photos');
    const info = document.getElementById('fileInfo');
    const btn = document.getElementById('uploadBtn');
    const status = document.getElementById('status');
    const bar = document.getElementById('progress');
    const preview = document.getElementById('preview');
    const choose = document.getElementById('chooseBtn');
    let busy = false;
    let previewUrls = [];

    choose.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!busy) input.click(); }
    });

    function typeOf(file) {
      if (file.type) return file.type;
      if (/\.heic$/i.test(file.name)) return 'image/heic';
      return '';
    }
    function show(text) { status.hidden = false; status.textContent = text; }
    input.addEventListener('change', () => {
      previewUrls.forEach(URL.revokeObjectURL); previewUrls = [];
      preview.replaceChildren();
      const files = Array.from(input.files || []);
      info.textContent = files.length ? files.length + ' photo(s) selected' : 'No photos selected yet';
      btn.disabled = files.length === 0;
      status.hidden = true;
      preview.hidden = files.length === 0;
      files.slice(0,6).forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const url = URL.createObjectURL(file);
        previewUrls.push(url);
        const img = document.createElement('img'); img.src = url; img.alt = 'Selected photo preview';
        preview.appendChild(img);
      });
    });
    async function preparePhoto(file) {
      // Resize photos before uploading to stay within Vercel's request size limits.
      const bitmap = await createImageBitmap(file);
      const maxEdge = 1800;
      const ratio = Math.min(1, maxEdge / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * ratio);
      canvas.height = Math.round(bitmap.height * ratio);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close();
      let quality = .82;
      let blob;
      do {
        blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
        quality -= .12;
      } while (blob && blob.size > 2 * 1024 * 1024 && quality >= .4);
      if (!blob || blob.size > 2.5 * 1024 * 1024) throw new Error('Photo could not be resized.');
      return blob;
    }
    async function sendToDrive(file) {
      const blob = await preparePhoto(file);
      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: {'Content-Type':'image/jpeg','X-Upload-Name':encodeURIComponent(file.name)},
        body: blob
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok || !result.success) throw new Error(result.error || 'Upload failed');
      return result;
    }
    btn.addEventListener('click', async () => {
      if (busy) return;
      const files = Array.from(input.files || []);
      if (!files.length) { show('Please choose photos first.'); return; }
      busy = true; btn.disabled = true; input.disabled = true; choose.style.opacity = '.6';
      bar.hidden = false; bar.value = 0;
      let success = 0;
      const errors = [];
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const type = typeOf(file);
        if (!allowed.has(type)) { errors.push(file.name + ': unsupported type'); bar.value = Math.round(((i + 1) / files.length) * 100); continue; }
        if (file.size > MAX_SIZE) { errors.push(file.name + ': exceeds 15 MB'); bar.value = Math.round(((i + 1) / files.length) * 100); continue; }
        try {
          show('Uploading photo ' + (i + 1) + ' of ' + files.length + '…');
          await sendToDrive(file);
          success++;
        } catch (err) {
          errors.push(file.name + ': ' + (err && err.message ? err.message : 'upload failed'));
        }
        bar.value = Math.round(((i + 1) / files.length) * 100);
      }
      show(success + ' of ' + files.length + ' photo(s) uploaded successfully.' + (errors.length ? ' Issues: ' + errors.join('; ') : ' Thank you! 🤎'));
      if (errors.length === 0) { input.value = ''; preview.replaceChildren(); preview.hidden = true; info.textContent = 'No photos selected yet'; }
      busy = false; input.disabled = false; choose.style.opacity = '1'; btn.disabled = !input.files.length;
    });
  </script>
</body>
</html>
